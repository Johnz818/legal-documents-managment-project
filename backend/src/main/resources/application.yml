server:
  port: 8080

spring:
  application:
    name: legal-case-management
  servlet:
    multipart:
      max-file-size: ${LEGAL_DOCUMENT_MAX_FILE_SIZE:5MB}
      max-request-size: ${LEGAL_DOCUMENT_MAX_FILE_SIZE:5MB}
  datasource:
    url: ${LEGAL_DB_URL}
    username: ${LEGAL_DB_USERNAME}
    password: ${LEGAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

legal:
  document:
    storage:
      local:
        root: ${LEGAL_DOCUMENT_STORAGE_ROOT:./.local-data/documents}
    upload:
      max-file-size: ${LEGAL_DOCUMENT_MAX_FILE_SIZE:5MB}
